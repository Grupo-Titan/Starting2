<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WhatsApp Bonos Paraguay</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;

      background-color: #000000;
      color: #FFD700;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 20px 20px 75px;

      position: relative;
      overflow-x: hidden;
    }


    /* =============================
       FONDO CARRUSEL
       ============================= */

    .background-carousel {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: -1;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000000;
    }


    .background-carousel img {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transition: opacity 2s ease-in-out;
    }


    .background-carousel img.active {
      opacity: 0.55;
    }


    /* =============================
       HEADER
       ============================= */

    header {
      margin-top: 30px;
      text-align: center;
    }


    .logo-text {
      color: #FFD700;

      font-weight: 700;
      font-size: 28px;

      text-shadow:
        0 2px 5px rgba(0,0,0,0.7),
        0 0 15px rgba(255,215,0,0.2);
    }


    hr {
      width: 100%;
      max-width: 500px;

      border: none;

      border-top: 2px solid #FFD700;

      margin: 20px 0;
    }


    /* =============================
       TITULO
       ============================= */

    .verified {
      text-align: center;
    }


    .verified h2 {
      font-size: 22px;

      margin: 10px 0;

      color: #FFD700;

      text-shadow: 1px 1px 2px #000000;
    }


    .verified .subtitle {
      color: #FFD700;

      font-weight: 600;

      opacity: 0.9;
    }


    /* =============================
       MENSAJE
       ============================= */

    .message {
      width: 100%;
      max-width: 420px;

      background: rgba(51,51,0,0.93);

      padding: 18px;

      border-radius: 12px;

      margin: 20px 0;

      font-size: 16px;

      color: #FFD700;

      box-shadow:
        0 4px 10px rgba(255,215,0,0.3);

      text-align: center;
    }


    /* =============================
       BOTÓN WHATSAPP
       ============================= */

    .whatsapp-button {
      background-color: #00CC44;

      color: #FFFFFF;

      padding: 18px 32px;

      border-radius: 50px;

      font-weight: 700;

      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 20px;

      font-size: 18px;

      border: none;

      cursor: pointer;

      width: 100%;
      max-width: 360px;

      box-shadow:
        0 0 15px #00CC44,
        0 0 30px rgba(0,204,68,0.6);

      animation:
        glow-green 1.5s infinite alternate;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

      text-align: center;
    }


    .whatsapp-button:hover {
      transform: scale(1.03);
    }


    .whatsapp-button:active {
      transform: scale(0.98);
    }


    .whatsapp-button i {
      font-size: 27px;

      flex-shrink: 0;
    }


    @keyframes glow-green {

      0% {
        box-shadow:
          0 0 10px #00CC44,
          0 0 20px #00FF55;
      }

      50% {
        box-shadow:
          0 0 20px #00CC44,
          0 0 40px #00FF55;
      }

      100% {
        box-shadow:
          0 0 15px #00CC44,
          0 0 30px #00FF55;
      }

    }


    /* =============================
       CLIENTES
       ============================= */

    .clientes {
      background-color: #FFD700;

      color: #000000;

      padding: 12px 20px;

      border-radius: 30px;

      font-weight: 600;

      margin-bottom: 20px;

      text-align: center;

      box-shadow:
        0 2px 8px rgba(255,215,0,0.4);
    }


    /* =============================
       NOTIFICACIONES
       ============================= */

    #notif-text {
      width: 100%;
      max-width: 420px;

      background:
        rgba(51,51,0,0.93);

      color: #FFD700;

      padding: 15px 20px;

      border-radius: 12px;

      font-size: 16px;

      margin: 15px 0;

      text-align: center;

      box-shadow:
        0 4px 12px rgba(255,215,0,0.25);

      transition: all 0.5s ease;
    }


    /* =============================
       FOOTER
       ============================= */

    .footer {
      position: fixed;

      bottom: 0;
      left: 0;

      width: 100%;

      background:
        linear-gradient(
          to right,
          #FFD700,
          #FFA500
        );

      color: #000000;

      text-align: center;

      padding: 12px;

      font-weight: 700;

      font-size: 14px;

      box-shadow:
        0 -2px 8px rgba(255,215,0,0.4);

      z-index: 20;
    }


    /* =============================
       CELULARES
       ============================= */

    @media (max-width: 480px) {

      body {
        padding-left: 15px;
        padding-right: 15px;
      }

      .logo-text {
        font-size: 24px;
      }

      .verified h2 {
        font-size: 20px;
      }

      .whatsapp-button {
        font-size: 16px;

        padding: 17px 24px;
      }

      .whatsapp-button i {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>


  <!-- =============================
       FONDOS
       ============================= -->

  <div class="background-carousel">

    <img
      src="fondo1.jpg"
      class="active"
      alt=""
    >

    <img
      src="fondo2.jpg"
      alt=""
    >

    <img
      src="fondo3.jpg"
      alt=""
    >

    <img
      src="fondo4.jpg"
      alt=""
    >

  </div>


  <!-- =============================
       CABECERA
       ============================= -->

  <header>

    <div class="logo-text">
      WhatsApp Bonos Paraguay
    </div>

  </header>


  <hr>


  <!-- =============================
       TITULO
       ============================= -->

  <section class="verified">

    <h2>
      🎰 Atención Online
    </h2>

    <p class="subtitle">
      Contactanos por WhatsApp
    </p>

  </section>


  <!-- =============================
       MENSAJE
       ============================= -->

  <div class="message">

    Te estamos conectando con nuestro equipo
    vía WhatsApp para consultar promociones disponibles.

  </div>


  <!-- =============================
       BOTÓN WHATSAPP
       ============================= -->

  <a
    class="whatsapp-button"

    href="https://wa.me/5491154075676?text=Quiero%20mi%20bono%20de%20100%25"

    target="_blank"

    rel="noopener noreferrer"
  >

    <i class="fab fa-whatsapp"></i>

    <span>
      Quiero mi bono de 100%
    </span>

  </a>


  <!-- =============================
       ATENCIÓN
       ============================= -->

  <div class="clientes">

    👥 Atención personalizada

  </div>


  <!-- =============================
       AVISOS
       ============================= -->

  <div id="notif-text"></div>


  <!-- =============================
       FOOTER
       ============================= -->

  <div class="footer">

    🎁 BONO ACTIVO - ¡Solicítalo ahora por WhatsApp!

  </div>


  <!-- =============================
       JAVASCRIPT
       ============================= -->

  <script>

    /* =============================
       CARRUSEL DE FONDO
       ============================= */

    const fondos =
      document.querySelectorAll(
        '.background-carousel img'
      );


    let fondoActual = 0;


    if (fondos.length > 1) {

      setInterval(() => {

        fondos[fondoActual]
          .classList.remove('active');


        fondoActual =
          (fondoActual + 1) %
          fondos.length;


        fondos[fondoActual]
          .classList.add('active');

      }, 8000);

    }


    /* =============================
       AVISOS DINÁMICOS
       ============================= */

    const avisos = [

      {
        texto:
          "📲 Atención disponible por WhatsApp"
      },

      {
        texto:
          "🇵🇾 Atención para clientes de Paraguay"
      },

      {
        texto:
          "⚡ Consultá promociones disponibles"
      }

    ];


    let indice = 0;


    function actualizarNotificacion() {

      const notifText =
        document.getElementById(
          'notif-text'
        );

      const aviso =
        avisos[
          indice % avisos.length
        ];

      notifText.innerHTML =
        aviso.texto;

      indice++;

    }

    actualizarNotificacion();

    setInterval(
      actualizarNotificacion,
      5000
    );

  </script>

</body>
</html>

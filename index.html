  <script>
    !function(f,b,e,v,n,t,s) {
      if (f.fbq) return;

      n = f.fbq = function() {
        n.callMethod
          ? n.callMethod.apply(n, arguments)
          : n.queue.push(arguments);
      };

      if (!f._fbq) f._fbq = n;

      n.push = n;
      n.loaded = true;
      n.version = '2.0';
      n.queue = [];

      t = b.createElement(e);
      t.async = true;

  <style>

    hr {

      border-top: 2px solid #FFD700;

    @keyframes glow-green {

      }

          0 0 20px #00CC44,

    /* =============================

  <!-- ============================================
       JAVASCRIPT
       ============================================ -->

  <script>


    /* =========================================
       CONTACT
       SE DISPARA AL TOCAR WHATSAPP
       ========================================= */

    function registrarContactoMeta() {

      if (typeof fbq === 'function') {

        fbq(
          'track',
          'Contact',
          {
            content_name: 'WhatsApp Paraguay'
          }
        );

        console.log(
          'Meta Pixel: Contact enviado'
        );

      }

    }



    /* =========================================
       PURCHASE PARAGUAY
       MONEDA = PYG

       IMPORTANTE:
       NO SE EJECUTA AUTOMÁTICAMENTE.

       Se llama solamente cuando una compra
       fue realmente confirmada.

       EJEMPLO:

       registrarPurchasePYG(
         100000,
         "VENTA-12345"
       );

       Eso enviaría:

       Purchase
       value: 100000
       currency: PYG
       ========================================= */

    function registrarPurchasePYG(
      valor,
      eventId = null
    ) {

      const monto =
        Number(valor);

      if (
        !Number.isFinite(monto) ||
        monto <= 0
      ) {

        console.error(
          'Purchase cancelado: monto inválido'
        );

        return null;

      }


      const identificador =
        eventId ||
        (
          'purchase-py-' +
          Date.now() +
          '-' +
          Math.random()
            .toString(36)
            .substring(2, 9)
        );


      if (typeof fbq === 'function') {

        fbq(
          'track',
          'Purchase',

          {
            value: monto,
            currency: 'PYG'
          },

          {
            eventID: identificador
          }
        );


        console.log(
          'Meta Purchase enviado:',
          monto,
          'PYG',
          identificador
        );

      }


      return identificador;

    }



    /* =========================================
       CARRUSEL
       ========================================= */

    const fondos =
      document.querySelectorAll(
        '.background-carousel img'
      );


    let fondoActual = 0;


    if (fondos.length > 1) {

      setInterval(() => {

        fondos[fondoActual]
          .classList.remove('active');


        fondoActual =
          (fondoActual + 1) %
          fondos.length;


        fondos[fondoActual]
          .classList.add('active');

      }, 8000);

    }



    /* =========================================
       AVISOS VISUALES

       Usalos únicamente para información
       real/verificable.
       ========================================= */

    const avisos = [

      {
        texto:
          "📲 Atención disponible por WhatsApp"
      },

      {
        texto:
          "🇵🇾 Atención para clientes de Paraguay"
      },

      {
        texto:
          "⚡ Consultá promociones disponibles"
      }

    ];


    let indice = 0;


    function actualizarNotificacion() {

      const notifText =
        document.getElementById(
          'notif-text'
        );


      const aviso =
        avisos[
          indice % avisos.length
        ];


      notifText.innerHTML =
        aviso.texto;


      indice++;

    }


    actualizarNotificacion();


    setInterval(
      actualizarNotificacion,
      5000
    );


  </script>
